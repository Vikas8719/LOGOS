name: LOGOS CI - Build Test Train (v10 Phase 1+2+Physics)

permissions:
  contents: read

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

# =============================================================
#  JOB 1: T2 Math Tests (CPU) - Linux / Windows / macOS
# =============================================================
  math-tests-linux:
    name: "T2 Math Tests - Linux"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 12 + CMake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Configure CPU only
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20"

      - name: Build CPU tests
        run: cmake --build build --target test_math_unit test_checkpoint --parallel $(nproc)

      - name: Verify M11-M16 coverage in output
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure
          ./build/test_math_unit 2>&1 | tee /tmp/math_out.txt
          for test_id in M11 M12 M13 M14 M15 M16; do
            if grep -q "\[$test_id\]" /tmp/math_out.txt; then
              echo "✅ $test_id present in output"
            else
              echo "❌ $test_id MISSING from output"; exit 1
            fi
          done

      - name: Run CPU logos tests
        run: |
          cmake --build build --target logos --parallel $(nproc)
          ./build/logos --test
          ./build/logos --forward
          ./build/logos --benchmark

  math-tests-windows:
    name: "T2 Math Tests - Windows"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build CPU tests (Release)
        run: cmake --build build --config Release --target test_math_unit test_checkpoint --parallel 4

      - name: Verify M11-M16 coverage (Windows)
        run: |
          ctest --test-dir build -C Release --output-on-failure
          $output = & .\build\Release\test_math_unit.exe 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath math_out.txt
          if ($exitCode -ne 0) { exit $exitCode }
          foreach ($test_id in @('M11','M12','M13','M14','M15','M16')) {
            if (-not ($output -match "\[$test_id\]")) { throw "MISSING $test_id" }
          }

  math-tests-macos:
    name: "T2 Math Tests - macOS ARM64"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O2 -std=c++20"

      - name: Build CPU tests
        run: cmake --build build --target test_math_unit test_checkpoint --parallel $(sysctl -n hw.logicalcpu)

      - name: Verify M11-M16 coverage (macOS)
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure
          ./build/test_math_unit 2>&1 | tee /tmp/math_out_mac.txt
          for test_id in M11 M12 M13 M14 M15 M16; do
            grep -q "\[$test_id\]" /tmp/math_out_mac.txt \
              && echo "✅ $test_id" \
              || { echo "❌ $test_id MISSING"; exit 1; }
          done

# =============================================================
#  JOB 2: T1 + T3 - GPU Tests (Syntax + Memory Stress)
# =============================================================
  gpu-tests:
    name: "T1+T3 GPU Tests"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Check for CUDA
        id: cuda_check
        run: |
          if command -v nvcc &>/dev/null; then
            echo "cuda_available=true" >> $GITHUB_OUTPUT
          else
            echo "cuda_available=false" >> $GITHUB_OUTPUT
            echo "No CUDA found - GPU tests will be skipped"
          fi

      - name: Configure
        run: |
          if [ "${{ steps.cuda_check.outputs.cuda_available }}" = "true" ]; then
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=g++-12 \
              -DCUDA_ARCH_MODE=native \
              -DLOGOS_USE_CUBLAS=ON \
              -DLOGOS_CUBLAS_TF32=OFF \
              -DCMAKE_CUDA_FLAGS="--extended-lambda"
          else
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=g++-12 \
              -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20"
          fi

      - name: Build CPU targets
        run: cmake --build build --target logos test_math_unit test_checkpoint --parallel $(nproc)

      - name: Build GPU targets
        if: steps.cuda_check.outputs.cuda_available == 'true'
        run: cmake --build build --target logos_gpu test_syntax_build test_memory_stress --parallel $(nproc)

      - name: Run checkpoint round-trip test
        run: ctest --test-dir build -R Checkpoint_Roundtrip --output-on-failure

      - name: Run T1 - Syntax and Build Tests
        if: steps.cuda_check.outputs.cuda_available == 'true'
        run: ./build/test_syntax_build

      - name: Run T3 - Memory and Bounds Stress
        if: steps.cuda_check.outputs.cuda_available == 'true'
        run: ./build/test_memory_stress

      - name: GPU tests skipped - run CPU math fallback (M1-M16)
        if: steps.cuda_check.outputs.cuda_available == 'false'
        run: |
          ./build/test_math_unit
          # Verify all physics tests present even in GPU fallback path
          ./build/test_math_unit 2>&1 | grep -E "\[M1[1-6]\]" | wc -l | \
            xargs -I{} bash -c 'if [ {} -ge 6 ]; then echo "✅ All M11-M16 present"; else echo "❌ Missing physics tests"; exit 1; fi'

      - name: cuda-memcheck on T3
        if: steps.cuda_check.outputs.cuda_available == 'true'
        continue-on-error: true
        run: |
          if command -v compute-sanitizer &>/dev/null; then
            timeout 300 compute-sanitizer --tool memcheck --leak-check full --error-exitcode 1 ./build/test_memory_stress 2>&1 | tail -50
          elif command -v cuda-memcheck &>/dev/null; then
            timeout 300 cuda-memcheck --leak-check full ./build/test_memory_stress 2>&1 | tail -50
          else
            echo "No CUDA memory checker found"
          fi

# =============================================================
#  JOB 3: Full Training + Eval Pipeline (Linux, CPU)
# =============================================================
  training-pipeline:
    name: "Training Pipeline - CPU E2E"
    runs-on: ubuntu-22.04
    needs: [math-tests-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 12
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Configure and Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O3 -march=x86-64 -std=c++20"
          cmake --build build --parallel $(nproc)

      - name: Run T2 Math Tests (M1-M16 full suite)
        run: |
          ./build/test_math_unit 2>&1 | tee /tmp/t2_output.txt
          echo "--- Physics component test summary ---"
          grep -E "(M1[1-6]|✅|❌)" /tmp/t2_output.txt | head -40
          # Fail CI if any test assertion failed
          if grep -q "❌" /tmp/t2_output.txt; then
            echo "FAIL: One or more math unit tests failed"
            exit 1
          fi
          echo "PASS: All M1-M16 math unit tests passed"

      - name: Download dataset
        run: |
          EXPECTED_SHA="f2d94a6b46fe8c4d01e7bc4be49e5e7cd04cb47aec3a1dce17f8e37e72e16b51"
          DOWNLOAD_OK=false

          curl -L "https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt" \
            --max-filesize 5242880 -o dataset_raw.txt --fail --silent --show-error \
            && DOWNLOAD_OK=true || echo "Download failed - synthetic fallback"

          if [ "$DOWNLOAD_OK" = "true" ] && [ -s dataset_raw.txt ]; then
            ACTUAL_SHA=$(sha256sum dataset_raw.txt | awk '{print $1}')
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "SHA-256 mismatch - falling back to synthetic"
              DOWNLOAD_OK=false
            else
              echo "Dataset verified: $ACTUAL_SHA"
              head -c 1048576 dataset_raw.txt > dataset.txt
            fi
          fi

          if [ "$DOWNLOAD_OK" = "false" ] || [ ! -s dataset.txt ]; then
            python3 -c "import random; random.seed(42); words = ['the','cat','sat','on','mat','a','dog','ran','fast','slow','big','small','red','blue','green','happy','sad','old','new','Once','upon','time','there','was','little','girl','named','Lily']; lines = [' '.join(random.choices(words, k=random.randint(10,30)))+'.' for _ in range(5000)]; open('dataset.txt','w').write('\n'.join(lines))"
            echo "Using synthetic dataset"
          fi
          echo "Dataset size: $(wc -c < dataset.txt) bytes"

      - name: Train CI mini-run
        run: |
          timeout 600 ./build/logos --train dataset.txt --steps 200 || \
          timeout 600 ./build/logos --train dataset.txt --max-steps 200 || \
          timeout 600 ./build/logos --train dataset.txt
          echo "Training exit: $?"
          ls -la *.bin 2>/dev/null || echo "No checkpoint - normal for short run"

      - name: Evaluate
        run: ./build/logos --eval dataset.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logos-linux-training
          path: |
            build/logos
            build/test_math_unit
            *.bin
          if-no-files-found: ignore
          retention-days: 7

# =============================================================
#  JOB 4: Windows Build + T2
# =============================================================
  windows-build:
    name: "Windows Build + T2"
    runs-on: windows-latest
    needs: [math-tests-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Configure (MSVC)
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build all CPU targets
        run: cmake --build build --config Release --parallel 4

      - name: Unit Tests
        run: .\build\Release\logos.exe --test

      - name: T2 Math Tests (M1-M16)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify M11-M16 physics tests pass (Windows build job)
        run: |
          $output = & .\build\Release\test_math_unit.exe 2>&1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $output | Tee-Object -FilePath win_t2.txt
          foreach ($id in @('M11','M12','M13','M14','M15','M16')) {
            if (-not ($output -match "\[$id\]")) { throw "MISSING $id" }
          }

      - name: Forward and Benchmark
        run: |
          .\build\Release\logos.exe --forward
          .\build\Release\logos.exe --benchmark

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: logos-windows-x86_64
          path: |
            build/Release/logos.exe
            build/Release/test_math_unit.exe
          retention-days: 7

# =============================================================
#  JOB 5: macOS Build + T2
# =============================================================
  macos-build:
    name: "macOS ARM64 Build + T2"
    runs-on: macos-14
    needs: [math-tests-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -std=c++20"

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Tests
        run: |
          ./build/logos --test
          ./build/logos --forward
          ./build/logos --benchmark

      - name: T2 Math Tests (M1-M16)
        run: |
          ./build/test_math_unit 2>&1 | tee /tmp/mac_t2.txt
          for id in M11 M12 M13 M14 M15 M16; do
            grep -q "\[$id\]" /tmp/mac_t2.txt \
              && echo "✅ $id" \
              || { echo "❌ $id MISSING"; exit 1; }
          done

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: logos-macos-arm64
          path: |
            build/logos
            build/test_math_unit
          retention-days: 7

# =============================================================
#  JOB 6: Kaggle GPU Notebook Trigger
# =============================================================
  kaggle-gpu-trigger:
    name: "Kaggle GPU Test Trigger"
    runs-on: ubuntu-22.04
    needs: [math-tests-linux]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: pip install kaggle --quiet

      - name: Trigger Kaggle GPU notebook
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Kaggle secrets not configured - skipping"
            exit 0
          fi
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}\n' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "Kaggle API configured"

# =============================================================
#  SUMMARY
# =============================================================
  summary:
    name: "CI Summary"
    runs-on: ubuntu-22.04
    needs:
      - math-tests-linux
      - math-tests-windows
      - math-tests-macos
      - gpu-tests
      - training-pipeline
      - windows-build
      - macos-build
    if: always()
    steps:
      - name: Print results and check failures
        env:
          R_LINUX: ${{ needs['math-tests-linux'].result }}
          R_WINDOWS: ${{ needs['math-tests-windows'].result }}
          R_MACOS: ${{ needs['math-tests-macos'].result }}
          R_GPU: ${{ needs['gpu-tests'].result }}
          R_TRAIN: ${{ needs['training-pipeline'].result }}
          R_WIN_BUILD: ${{ needs['windows-build'].result }}
          R_MAC_BUILD: ${{ needs['macos-build'].result }}
        run: |
          echo "═══════════════════════════════════════════════════"
          echo "  LOGOS CI Summary (v10 — Physics Component Tests)"
          echo "═══════════════════════════════════════════════════"
          echo "  T2 Math Linux   (M1-M16): $R_LINUX"
          echo "  T2 Math Windows (M1-M16): $R_WINDOWS"
          echo "  T2 Math macOS   (M1-M16): $R_MACOS"
          echo "  T1+T3 GPU (Syntax+Mem):   $R_GPU"
          echo "  Training Pipeline E2E:    $R_TRAIN"
          echo "  Windows Build + T2:       $R_WIN_BUILD"
          echo "  macOS ARM64 Build + T2:   $R_MAC_BUILD"
          echo "───────────────────────────────────────────────────"
          echo "  Math test coverage:"
          echo "    M1  - Urdhva Tiryagbhyam GEMM"
          echo "    M2  - Gunitasamuchayah (product of sums)"
          echo "    M3  - Free Energy F=CE-T*S"
          echo "    M4  - Leapfrog Langevin stability"
          echo "    M5  - Boltzmann softmax temperature"
          echo "    M6  - Nikhilam complement identity"
          echo "    M7  - Hyperbolic exp/log map"
          echo "    M8  - LayerNorm exact statistics"
          echo "    M9  - VedicGEMM tiling shapes"
          echo "    M10 - Gradient finite-difference check"
          echo "    M11 - Natural Gradient (Fisher EMA)"
          echo "    M12 - Navier-Stokes Attention (fluid)"
          echo "    M13 - Reynolds Batch Norm (laminar/turbulent)"
          echo "    M14 - Feynman Dropout (path integral)"
          echo "    M15 - Riemannian Metric (curved param space)"
          echo "    M16 - Weight Path Integral (action tracking)"
          echo "═══════════════════════════════════════════════════"

          if [ "$R_GPU" = "failure" ]; then
            echo "⚠️  WARNING: GPU tests failed - check if GPU runner is available"
          fi

          CRITICAL_FAIL=false
          for result in "$R_LINUX" "$R_WINDOWS" "$R_MACOS" "$R_TRAIN" "$R_WIN_BUILD" "$R_MAC_BUILD"; do
            if [ "$result" = "failure" ]; then
              CRITICAL_FAIL=true
            fi
          done

          if [ "$CRITICAL_FAIL" = "true" ]; then
            echo "FAILED: One or more critical jobs failed."
            echo ""
            echo "Debug guide:"
            echo "  T2 failures (M1-M10)   -> core math: check VedicGEMM, Tensor, PhysicsOpt"
            echo "  T2 failures (M11)      -> NaturalGradientOptimizer in PhysicsOpt.hpp"
            echo "  T2 failures (M12)      -> navier_stokes_attention() in Attention.hpp"
            echo "  T2 failures (M13)      -> ReynoldsBatchNorm in LayerNorm.hpp"
            echo "  T2 failures (M14)      -> FeynmanDropout in FeedForward.hpp"
            echo "  T2 failures (M15)      -> RiemannianMetric in Tensor.hpp"
            echo "  T2 failures (M16)      -> WeightPathIntegral in PhysicsOpt.hpp"
            echo "  T1 Syntax failures     -> check cuda/VedicGEMM.cu"
            echo "  T3 Memory failures     -> check cuda/ModelGPU.cu"
            echo "  Training failures      -> check src/main.cpp"
            exit 1
          fi

          echo "✅ PASSED: All critical jobs passed. M1-M16 math suite green."
