name: LOGOS CI — Build, Test & Train

# ── Security: minimal permissions (principle of least privilege) ──
permissions:
  contents: read

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Build + Unit Tests (Windows) ─────────────────────────────
  build-windows:
    name: Windows Build & Test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check tools
        run: |
          gcc --version
          cmake --version

      - name: Configure
        run: |
          cmake -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_FLAGS="-O3 -march=x86-64 -std=c++20"

      - name: Build
        run: cmake --build build --parallel 4

      - name: Unit Tests
        run: .\build\logos.exe --test

      - name: Forward Pass
        run: .\build\logos.exe --forward

      - name: Benchmark
        run: .\build\logos.exe --benchmark

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: logos-windows-x86_64
          path: build/logos.exe
          retention-days: 7

  # ── Build + Unit Tests (Linux) ───────────────────────────────
  build-linux:
    name: Linux Build & Test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 12
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives \
            --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 \
            --slave   /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Configure
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O3 -march=x86-64 -std=c++20"

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Unit Tests
        run: ./build/logos --test

      - name: Forward Pass
        run: ./build/logos --forward

      - name: Benchmark
        run: ./build/logos --benchmark

      # ── Training on TinyStories (mini) ─────────────────────
      - name: Download TinyStories dataset (1MB sample)
        run: |
          # ── SECURITY: HuggingFace dataset pinned SHA-256 checksum ──
          # SHA-256 of TinyStoriesV2-GPT4-train.txt (first 5MB slice)
          # Update this if HuggingFace file changes upstream
          EXPECTED_SHA="f2d94a6b46fe8c4d01e7bc4be49e5e7cd04cb47aec3a1dce17f8e37e72e16b51"

          DOWNLOAD_OK=false
          curl -L \
            "https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt" \
            --max-filesize 5242880 \
            -o dataset_raw.txt \
            --fail --silent --show-error \
            && DOWNLOAD_OK=true \
            || echo "Download failed — falling back to synthetic data"

          if [ "$DOWNLOAD_OK" = "true" ] && [ -s dataset_raw.txt ]; then
            # ── Checksum verify karo ──
            ACTUAL_SHA=$(sha256sum dataset_raw.txt | awk '{print $1}')
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "⚠️  SHA-256 mismatch — expected: $EXPECTED_SHA"
              echo "   actual:   $ACTUAL_SHA"
              echo "   Pinned checksum nahi mila. Synthetic fallback use ho raha hai."
              echo "   NOTE: Agar HuggingFace ne file update ki hai toh"
              echo "         EXPECTED_SHA ko update karo: $ACTUAL_SHA"
              DOWNLOAD_OK=false
            else
              echo "✅ Checksum verified: $ACTUAL_SHA"
              head -c 1048576 dataset_raw.txt > dataset.txt
              echo "TinyStories downloaded & verified: $(wc -c < dataset.txt) bytes"
            fi
          fi

          if [ "$DOWNLOAD_OK" = "false" ] || [ ! -s dataset.txt ]; then
            # ── Synthetic fallback ──
            echo "Once upon a time there was a little girl named Lily. She loved to play in the garden with her dog Max. One day they found a magical flower that could talk. The flower said hello and Lily was very surprised. Max barked happily. They became best friends with the flower and visited it every day after school. The end." > dataset.txt
            for i in $(seq 1 50); do
              echo "Once upon a time a small rabbit lived in a cozy burrow under an old oak tree. The rabbit had many friends in the forest including a wise owl and a playful squirrel. Every morning they would meet by the stream and share stories about their adventures. The owl taught the rabbit about the stars and the squirrel showed the rabbit where to find the best nuts. They lived happily together learning new things each day." >> dataset.txt
            done
            echo "Using synthetic dataset ($(wc -w < dataset.txt) words)"
          fi

          wc -l dataset.txt

      - name: Train LOGOS (CI mini-run — 200 steps)
        run: |
          # ── SECURITY FIX: || true hataya gaya ──
          # Pehle: training fail hone par bhi CI green tha
          # Ab:    real failure = real CI failure
          timeout 180 ./build/logos --train dataset.txt
          echo "Training step complete"
          ls -la *.bin 2>/dev/null || echo "No checkpoint yet (normal for short run)"

      - name: Evaluate
        run: |
          # ── SECURITY FIX: || true hataya gaya ──
          # Eval failure ab CI ko fail karega (hidden failures nahi)
          ./build/logos --eval dataset.txt

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: logos-linux-x86_64
          path: build/logos
          retention-days: 7

      - name: Upload checkpoint (if exists)
        uses: actions/upload-artifact@v4
        with:
          name: logos-checkpoint
          path: "*.bin"
          if-no-files-found: ignore
          retention-days: 30

  # ── Build + Unit Tests (macOS) ───────────────────────────────
  build-macos:
    name: macOS Build & Test (ARM64)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -std=c++20"
        # NOTE: no -march flag — Apple M1 (ARM64) pe x86-64 nahi chalta

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Unit Tests
        run: ./build/logos --test

      - name: Forward Pass
        run: ./build/logos --forward

      - name: Benchmark
        run: ./build/logos --benchmark

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: logos-macos-arm64
          path: build/logos
          retention-days: 7

  # ── Summary ──────────────────────────────────────────────────
  summary:
    name: CI Summary
    runs-on: ubuntu-22.04
    needs: [build-windows, build-linux, build-macos]
    if: always()
    steps:
      - name: Results
        env:
          WINDOWS_RESULT: ${{ needs['build-windows'].result }}
          LINUX_RESULT: ${{ needs['build-linux'].result }}
          MACOS_RESULT: ${{ needs['build-macos'].result }}
        run: |
          echo "Windows : $WINDOWS_RESULT"
          echo "Linux   : $LINUX_RESULT"
          echo "macOS   : $MACOS_RESULT"
          # Agar koi bhi job fail ho toh summary fail ho
          if [ "$WINDOWS_RESULT" != "success" ] || \
             [ "$LINUX_RESULT"   != "success" ] || \
             [ "$MACOS_RESULT"   != "success" ]; then
            echo "❌ One or more jobs failed."
            exit 1
          fi
          echo "✅ All jobs passed."
