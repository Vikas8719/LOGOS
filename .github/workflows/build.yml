name: LOGOS CI v27-PhysicsMull

permissions:
  contents: read

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────
#  JOB OVERVIEW  (v26 — Hypothesis → RapidCheck C++ replaced)
#  ┌──────────────────────────────────────────────────────────────┐
#  │  cpu-tests-linux   → T2 Math + T2b Checkpoint + T4 LDS      │
#  │  cpu-tests-windows → T2 Math + T2b Checkpoint + T4 LDS      │
#  │  cpu-tests-macos   → T2 Math + T2b Checkpoint + T4 LDS      │
#  │  gpu-tests         → T1+T3+T4+T5 via ctest -L GPU           │
#  │  rapidcheck-tests  → T7 RapidCheck C++ property tests       │
#  │  mutation-tests    → T6 MULL (clang++, non-blocking)        │
#  │  linux-build       → full Linux build + E2E smoke            │
#  │  windows-build     → full Windows build smoke                │
#  │  macos-build       → full macOS build smoke                  │
#  │  kaggle-gpu-trigger→ async Kaggle GPU notebook push          │
#  │  summary           → final CI gate                           │
#  └──────────────────────────────────────────────────────────────┘
#
#  Sanitizer layers:
#    ASan+UBSan  : cmake -DLOGOS_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
#    compute-san : cmake -DLOGOS_USE_COMPUTE_SANITIZER=ON
#    MULL        : cmake -DLOGOS_MUTATION_TEST=ON -DCMAKE_CXX_COMPILER=clang++
#                  cmake --build build --target mull-run
# ─────────────────────────────────────────────────────────────────

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  CPU TESTS — Linux
  #  T2_Math_Unit + T2b_Checkpoint + T4_Large_Data_Scale
  # ═══════════════════════════════════════════════════════════════
  cpu-tests-linux:
    name: "CPU Tests — Linux (T2 + T2b + T4)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives --install /usr/bin/gcc gcc \
            /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Configure (CPU-only)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20"

      - name: Build CPU targets
        run: |
          cmake --build build \
            --target test_math_unit test_checkpoint test_large_data_scale logos \
            --parallel $(nproc)

      - name: CTest — T2 Math + T2b Checkpoint + T4 Large Data Scale
        working-directory: build
        run: ctest --output-on-failure -LE "GPU" --timeout 600 -j 1

  # ═══════════════════════════════════════════════════════════════
  #  CPU TESTS — Windows
  #  NOTE: PowerShell does NOT support backslash line continuation.
  # ═══════════════════════════════════════════════════════════════
  cpu-tests-windows:
    name: "CPU Tests — Windows (T2 + T2b + T4)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20"

      - name: Build
        run: cmake --build build --target test_math_unit test_checkpoint test_large_data_scale --parallel 4

      - name: CTest — T2 Math + T2b Checkpoint + T4 Large Data Scale
        working-directory: build
        run: ctest --output-on-failure -LE "GPU" --timeout 600

  # ═══════════════════════════════════════════════════════════════
  #  CPU TESTS — macOS
  # ═══════════════════════════════════════════════════════════════
  cpu-tests-macos:
    name: "CPU Tests — macOS (T2 + T2b + T4)"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O2 -std=c++20"

      - name: Build
        run: cmake --build build --target test_math_unit test_checkpoint test_large_data_scale --parallel $(sysctl -n hw.logicalcpu)

      - name: CTest — T2 Math + T2b Checkpoint + T4 Large Data Scale
        working-directory: build
        run: ctest --output-on-failure -LE "GPU" --timeout 600

  # ═══════════════════════════════════════════════════════════════
  #  GPU TESTS
  #  Runs T1+T3+T4+T5 via: ctest -L GPU --output-on-failure
  # ═══════════════════════════════════════════════════════════════
  gpu-tests:
    name: "GPU Tests (T1+T3+T4+T5 via ctest)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives --install /usr/bin/gcc gcc \
            /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Detect CUDA
        id: cuda
        run: |
          if command -v nvcc &>/dev/null; then
            VER=$(nvcc --version | grep "release" | awk '{print $5}' | tr -d ',')
            echo "available=true"  >> $GITHUB_OUTPUT
            echo "version=$VER"    >> $GITHUB_OUTPUT
            echo "✅ CUDA $VER found"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️  No CUDA — GPU tests will be skipped (non-blocking)"
          fi

      - name: Configure (with CUDA)
        if: steps.cuda.outputs.available == 'true'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCUDA_ARCH_MODE=native

      - name: Configure (CPU fallback)
        if: steps.cuda.outputs.available == 'false'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20"

      - name: Build all GPU targets
        if: steps.cuda.outputs.available == 'true'
        run: |
          cmake --build build \
            --target logos_gpu \
                     test_syntax_build \
                     test_math_unit \
                     test_memory_stress \
                     test_large_data_scale \
                     test_cuda_kernels \
            --parallel $(nproc)

      - name: Build CPU fallback targets
        if: steps.cuda.outputs.available == 'false'
        run: |
          cmake --build build \
            --target logos test_math_unit test_checkpoint test_large_data_scale \
            --parallel $(nproc)

      - name: CTest — GPU tests (T1 T3 T4 T5)
        if: steps.cuda.outputs.available == 'true'
        working-directory: build
        run: |
          ctest --output-on-failure \
                -L "GPU" \
                --timeout 600 \
                -j 1 \
                --test-output-size-passed 8192 \
                --test-output-size-failed 65536

      - name: CTest — CPU fallback (no CUDA runner)
        if: steps.cuda.outputs.available == 'false'
        working-directory: build
        run: ctest --output-on-failure -LE "GPU" --timeout 600 -j 1

      - name: compute-sanitizer memcheck on T5
        if: steps.cuda.outputs.available == 'true'
        continue-on-error: true
        run: |
          if command -v compute-sanitizer &>/dev/null; then
            timeout 300 compute-sanitizer \
              --tool memcheck --leak-check full --error-exitcode 1 \
              ./build/test_cuda_kernels 2>&1 | tail -80
          else
            echo "compute-sanitizer not available"
          fi

      - name: Upload CTest results
        if: always() && steps.cuda.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-gpu
          path: build/Testing/
          if-no-files-found: ignore
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  #  LINUX BUILD — Full build + E2E training smoke
  #  (Replaces old training-pipeline job — now visible in UI)
  # ═══════════════════════════════════════════════════════════════
  linux-build:
    name: "Linux Build + E2E Training"
    runs-on: ubuntu-22.04
    needs: [cpu-tests-linux]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives --install /usr/bin/gcc gcc \
            /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Configure and Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O3 -march=x86-64 -std=c++20"
          cmake --build build --parallel $(nproc)

      - name: logos CPU smoke
        run: |
          ./build/logos --test
          ./build/logos --forward
          ./build/logos --benchmark

      - name: Prepare dataset
        run: |
          curl -L "https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt" \
            --max-filesize 524288 -o dataset_raw.txt --fail --silent --show-error \
            && head -c 102400 dataset_raw.txt > dataset.txt \
            || python3 -c "
          import random; random.seed(42)
          w=['the','cat','sat','on','mat','a','dog','ran','fast','slow','big','small','red','blue','Once','upon','time','there','was','little','girl','named','Lily']
          print('\n'.join([' '.join(random.choices(w,k=random.randint(10,30)))+'.' for _ in range(500)]))" > dataset.txt
          echo "Dataset: $(wc -c < dataset.txt) bytes"

      - name: Train
        run: timeout 600 ./build/logos --train dataset.txt || true

      - name: Evaluate
        run: ./build/logos --eval dataset.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logos-linux
          path: |
            build/logos
            build/test_math_unit
            *.bin
          if-no-files-found: ignore
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  #  WINDOWS BUILD
  # ═══════════════════════════════════════════════════════════════
  windows-build:
    name: "Windows Build"
    runs-on: windows-latest
    needs: [cpu-tests-windows]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-O3 -march=x86-64 -std=c++20"

      - name: Build
        run: cmake --build build --parallel 4

      - name: CTest CPU
        working-directory: build
        run: ctest --output-on-failure -LE "GPU" --timeout 600

      - name: logos smoke
        run: |
          .\build\logos.exe --test
          .\build\test_math_unit.exe
          .\build\logos.exe --forward
          .\build\logos.exe --benchmark

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: logos-windows
          path: |
            build/logos.exe
            build/test_math_unit.exe
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  #  macOS BUILD
  # ═══════════════════════════════════════════════════════════════
  macos-build:
    name: "macOS Build"
    runs-on: macos-14
    needs: [cpu-tests-macos]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-O3 -std=c++20"

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: CTest CPU
        working-directory: build
        run: ctest --output-on-failure -LE "GPU" --timeout 600

      - name: logos smoke
        run: |
          ./build/logos --test
          ./build/test_math_unit
          ./build/logos --forward
          ./build/logos --benchmark

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: logos-macos
          path: |
            build/logos
            build/test_math_unit
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  #  RAPIDCHECK — C++ Property-Based Tests (T7)
  #  Hypothesis (Python) ko replace kiya — woh C++ ka Python re-implementation tha.
  #  RapidCheck actual C++ headers directly include karta hai:
  #    VedicGEMM.hpp, Tensor.hpp, PhysicsOpt.hpp, Checkpoint.hpp, LayerNorm.hpp
  #  Tests:
  #    RC1: VedicGEMM == reference (random sizes + values)
  #    RC2: VEDIC_BLOCK=64 boundary (63,64,65,128,129)
  #    RC3: vedic_gemm_bias correctness
  #    RC4: Free Energy F=CE-T*S properties
  #    RC5: Tensor reshape roundtrip
  #    RC6: Riemannian distance symmetry, self=0, triangle
  #    RC7: Checkpoint size formula (random ModelConfig)
  #    RC8: Leapfrog energy drift < Euler drift
  #  Non-blocking: continue-on-error: true
  # ═══════════════════════════════════════════════════════════════
  rapidcheck-tests:
    name: "RapidCheck C++ Property Tests (T7)"
    runs-on: ubuntu-22.04
    needs: [cpu-tests-linux]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build git
          sudo update-alternatives --install /usr/bin/gcc gcc \
            /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Configure (LOGOS_RAPIDCHECK=ON — FetchContent se rapidcheck download hoga)
        run: |
          cmake -B build_rc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20" \
            -DLOGOS_RAPIDCHECK=ON

      - name: Build test_rapidcheck
        run: |
          cmake --build build_rc \
            --target test_rapidcheck \
            --parallel $(nproc)
        env:
          # Agar build mein CUDA nahi hai toh bhi test_rapidcheck target hona chahiye
          # (CPU-only branch mein LOGOS_RAPIDCHECK=ON se yeh target define hota hai)
          NINJA_STATUS: "[%f/%t] "

      - name: Run RapidCheck property tests (T7)
        id: rc_run
        run: |
          ./build_rc/test_rapidcheck 2>&1 | tee rc_output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: RapidCheck Summary
        if: always()
        run: |
          PASSED=$(grep -c "✅" rc_output.log 2>/dev/null || echo 0)
          FAILED=$(grep -c "❌" rc_output.log 2>/dev/null || echo 0)

          echo "════════════════════════════════════════════════════"
          echo "  RapidCheck C++ Property Test Results (T7)"
          echo "════════════════════════════════════════════════════"
          grep -E "(RC[0-9]|✅|❌|PASSED|FAILED)" rc_output.log || true
          echo "════════════════════════════════════════════════════"

          python3 - <<'PYEOF'
          log = open("rc_output.log").read() if __import__("os").path.exists("rc_output.log") else ""
          passed = log.count("✅")
          failed = log.count("❌")
          total  = passed + failed
          emoji  = "✅" if failed == 0 else "❌"
          with open("$GITHUB_STEP_SUMMARY", "a") as f:
              f.write("## 🔬 RapidCheck C++ Property Tests — T7\n\n")
              f.write("| Test | Result |\n")
              f.write("|------|--------|\n")
              for line in log.splitlines():
                  if "RC" in line and ("✅" in line or "❌" in line):
                      icon = "✅" if "✅" in line else "❌"
                      f.write(f"| {line.strip()} | {icon} |\n")
              f.write(f"\n**Overall: {emoji} {passed}/{total} passed**\n\n")
              f.write("> RapidCheck actual C++ headers directly test karta hai —\n")
              f.write("> VedicGEMM.hpp, Tensor.hpp, PhysicsOpt.hpp, Checkpoint.hpp\n")
          PYEOF

      - name: Upload RapidCheck results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapidcheck-results
          path: rc_output.log
          if-no-files-found: ignore
          retention-days: 7

    # ═══════════════════════════════════════════════════════════════
  #  MULL MUTATION TESTING
  #  Test suite ki weakness dhundta hai:
  #    - src/VedicGEMM.cpp, src/Checkpoint.cpp
  #    - include/Tensor.hpp, PhysicsOpt.hpp, LayerNorm.hpp, Attention.hpp
  #  Target: Mutation score > 80% (90%+ excellent)
  #  Runtime: ~10-20 min (sabhi mutants × dono test binaries)
  #  Non-blocking: continue-on-error: true (CI block nahi karta)
  # ═══════════════════════════════════════════════════════════════
  mutation-tests:
    name: "MULL Mutation Tests (T6)"
    runs-on: ubuntu-22.04
    needs: [cpu-tests-linux]
    continue-on-error: true # mutation score gap se CI block nahi hoga
    steps:
      - uses: actions/checkout@v4

      - name: Install gcc-12, clang-15, LLVM-15, and MULL-15
        run: |
          # ── gcc-12 PEHLE install karo ────────────────────────────
          # Zaruri hai: clang-15 ubuntu-22.04 pe GCC ka libstdc++ use karta hai.
          # GCC-14 (default) ke saath clang-15 ka ABI mismatch hota hai —
          # std::__shared_ptr<_Dir>::operator bool() GCC-14 mein inline ho gaya
          # aur .so mein exist nahi karta, isliye undefined reference aata hai.
          # GCC-12 ke saath yeh symbol available hai.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build

          # ── clang-15 + llvm-15 (LLVM apt repo se) ──────────────
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] \
            http://apt.llvm.org/jammy/ llvm-toolchain-jammy-15 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list

          # ── MULL Cloudsmith repo ─────────────────────────────────
          # mull-17 sirf Ubuntu 24.04 Noble pe hai
          # Ubuntu 22.04 Jammy pe mull-15 latest stable hai (Cloudsmith se)
          curl -1sLf \
            'https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh' \
            | sudo -E distro=ubuntu codename=jammy bash

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-15 llvm-15 mull-15

          # symlinks — CMake find_program aur clang++ ko path milega
          sudo ln -sf /usr/bin/clang-15    /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-15  /usr/local/bin/clang++
          sudo ln -sf /usr/bin/mull-runner-15 /usr/local/bin/mull-runner

          # verify: gcc-12 crtbeginS.o available hai (clang ko yahi chahiye)
          echo "GCC-12 crtbeginS.o: $(g++-12 -print-file-name=crtbeginS.o)"
          ls $(g++-12 -print-file-name=crtbeginS.o)
          clang++ --version | head -1
          mull-runner --version 2>&1 | head -1


      - name: Configure (MULL + Debug + clang++ + GCC-12 sysroot)
        run: |
          # clang++ ko GCC-12 ka sysroot explicitly batao.
          # --gcc-toolchain ka matlab hai: clang GCC-12 ke installed prefix se
          # headers aur runtime libraries dhundega.
          # Ubuntu pe GCC-12 prefix hamesha /usr hota hai (bin/gcc-12, lib/gcc/... sab wahan hai).
          # dirname chain se galat /usr/lib aa sakta hai — isliye hardcode /usr use karo.
          GCC12_PREFIX=/usr
          echo "GCC-12 prefix: ${GCC12_PREFIX}"
          # Verify karo ki GCC-12 wahan hai
          ls /usr/bin/g++-12
          ls /usr/lib/gcc/x86_64-linux-gnu/12/crtbeginS.o

          # GCC-12 static archive paths verify karo (mull_checkpoint ke liye critical)
          GCC12_LIBDIR=$(g++-12 -print-file-name=libstdc++.a | xargs dirname)
          echo "GCC-12 libdir: ${GCC12_LIBDIR}"
          echo "libstdc++.a  : $(g++-12 -print-file-name=libstdc++.a)"
          echo "libstdc++fs.a: $(g++-12 -print-file-name=libstdc++fs.a)"

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLOGOS_MUTATION_TEST=ON \
            -DCMAKE_CXX_FLAGS="--gcc-toolchain=${GCC12_PREFIX}"

      - name: Build mutation targets
        run: |
          cmake --build build \
            --target mull_math_unit mull_checkpoint \
            --parallel $(nproc)

      - name: Check mull-runner version + output format
        run: |
          echo "=== mull-runner version ==="
          mull-runner --version 2>&1 || mull-runner -version 2>&1 || true
          echo "=== mull-runner help (first 20 lines) ==="
          mull-runner --help 2>&1 | head -20 || true

      - name: Diagnose mull-runner + binaries
        run: |
          echo "=== mull-runner full path ==="
          which mull-runner || echo "NOT IN PATH"
          ls -la /usr/local/bin/mull-runner || true
          ls -la /usr/bin/mull-runner-15 || true

          echo "=== Built binaries ==="
          ls -la build/mull_math_unit build/mull_checkpoint 2>&1 || echo "BINARIES NOT FOUND"

          echo "=== Binary execute test ==="
          ./build/mull_math_unit 2>&1 | head -5 || echo "Binary execute failed with $?"
          ./build/mull_checkpoint 2>&1 | head -5 || echo "Binary execute failed with $?"

          echo "=== mull-runner full --help ==="
          mull-runner --help 2>&1 || true

          echo "=== mull config file ==="
          cat build/mull.yml 2>&1 || echo "mull.yml not found in build/"

      - name: Run MULL — test_math_unit (M1-M16)
        id: mull_math
        continue-on-error: true
        run: |
          mkdir -p build/mull-report/math

          # mull-runner 0.34.1 mein --config flag NAHI hai
          # mull.yml auto-discover: binary ke saath same dir mein hona chahiye
          # ya current working directory mein
          cp build/mull.yml .   # cwd mein copy karo — mull yahan dhundta hai

          echo "--- Running mull-runner on mull_math_unit ---"
          mull-runner \
            --workers 2 \
            --timeout 30000 \
            --report-dir build/mull-report/math \
            build/mull_math_unit \
            2>&1 | tee build/mull-report/math/runner.log || true

          LOG=build/mull-report/math/runner.log

          echo "════ FULL MULL OUTPUT (math) ════"
          cat "$LOG"
          echo "════ END MULL OUTPUT (math) ════"

          # Format 1: "Mutation score: 85.71%"
          SCORE=$(grep -oP 'Mutation score: \K[\d.]+' "$LOG" 2>/dev/null | tail -1)

          # "infinitely high" = 0 mutants found = instrumentation missing
          if [ -z "$SCORE" ] && grep -q "infinitely high" "$LOG" 2>/dev/null; then
            echo "❌ No mutants found — check compile flags"
            SCORE="N/A"
          fi

          # Format 2: "Killed: 12 out of 14"
          if [ -z "$SCORE" ]; then
            KILLED=$(grep -oP 'Killed:\s*\K\d+' "$LOG" 2>/dev/null | tail -1)
            TOTAL=$(grep -oP 'out of\s*\K\d+' "$LOG" 2>/dev/null | tail -1)
            if [ -n "$KILLED" ] && [ -n "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              SCORE=$(python3 -c "print(f'{100*int(\"$KILLED\")/int(\"$TOTAL\"):.1f}')")
            fi
          fi

          # Format 3: "Killed mutants: 12 / 14"
          if [ -z "$SCORE" ]; then
            KILLED=$(grep -oP '[Kk]illed mutants?:\s*\K\d+' "$LOG" 2>/dev/null | tail -1)
            TOTAL=$(grep -oP '[Kk]illed mutants?:\s*\d+\s*/\s*\K\d+' "$LOG" 2>/dev/null | tail -1)
            if [ -n "$KILLED" ] && [ -n "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              SCORE=$(python3 -c "print(f'{100*int(\"$KILLED\")/int(\"$TOTAL\"):.1f}')")
            fi
          fi

          # Format 4: any percentage in log
          if [ -z "$SCORE" ]; then
            SCORE=$(grep -oP '\b\d+\.?\d*(?=%)' "$LOG" 2>/dev/null | tail -1)
          fi

          echo "Parsed math score: '${SCORE:-NOT_FOUND}'"
          echo "score=${SCORE:-N/A}" >> $GITHUB_OUTPUT

      - name: Run MULL — test_checkpoint (T2b)
        id: mull_ckpt
        continue-on-error: true
        run: |
          mkdir -p build/mull-report/checkpoint

          # mull.yml already CWD mein hai (prev step se copy hua)
          echo "--- Running mull-runner on mull_checkpoint ---"
          mull-runner \
            --workers 2 \
            --timeout 30000 \
            --report-dir build/mull-report/checkpoint \
            build/mull_checkpoint \
            2>&1 | tee build/mull-report/checkpoint/runner.log || true

          LOG=build/mull-report/checkpoint/runner.log

          echo "════ FULL MULL OUTPUT (checkpoint) ════"
          cat "$LOG"
          echo "════ END MULL OUTPUT (checkpoint) ════"

          SCORE=$(grep -oP 'Mutation score: \K[\d.]+' "$LOG" 2>/dev/null | tail -1)
          if [ -z "$SCORE" ] && grep -q "infinitely high" "$LOG" 2>/dev/null; then
            SCORE="N/A"
          fi
          if [ -z "$SCORE" ]; then
            KILLED=$(grep -oP 'Killed:\s*\K\d+' "$LOG" 2>/dev/null | tail -1)
            TOTAL=$(grep -oP 'out of\s*\K\d+' "$LOG" 2>/dev/null | tail -1)
            if [ -n "$KILLED" ] && [ -n "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              SCORE=$(python3 -c "print(f'{100*int(\"$KILLED\")/int(\"$TOTAL\"):.1f}')")
            fi
          fi
          if [ -z "$SCORE" ]; then
            SCORE=$(grep -oP '\b\d+\.?\d*(?=%)' "$LOG" 2>/dev/null | tail -1)
          fi

          echo "Parsed checkpoint score: '${SCORE:-NOT_FOUND}'"
          echo "score=${SCORE:-N/A}" >> $GITHUB_OUTPUT
          echo "--- Last 30 lines ---"
          tail -30 "$LOG"

      - name: Mutation Score Summary
        if: always()
        run: |
          MATH_SCORE="${{ steps.mull_math.outputs.score }}"
          CKPT_SCORE="${{ steps.mull_ckpt.outputs.score }}"
          echo "════════════════════════════════════════════════════"
          echo "  LOGOS MULL Mutation Testing Results"
          echo "════════════════════════════════════════════════════"
          echo "  test_math_unit   (M1-M16) : ${MATH_SCORE}%"
          echo "  test_checkpoint  (T2b)    : ${CKPT_SCORE}%"
          echo "════════════════════════════════════════════════════"
          python3 - "$MATH_SCORE" "$CKPT_SCORE" <<'PYEOF'
          import sys, os
          math_s = sys.argv[1] if len(sys.argv) > 1 else "N/A"
          ckpt_s = sys.argv[2] if len(sys.argv) > 2 else "N/A"
          scores = []
          for s in [math_s, ckpt_s]:
              try: scores.append(float(s))
              except: pass
          avg = sum(scores)/len(scores) if scores else None

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stderr")
          with open(summary_path, "a") as f:
              f.write("## 🧬 MULL Mutation Testing — T6\n\n")
              f.write("| Target | Score |\n|--------|-------|\n")
              def grade(v):
                  if v is None: return "N/A", "⚠️"
                  if v >= 90:   return f"{v:.1f}%", "🏆"
                  if v >= 80:   return f"{v:.1f}%", "✅"
                  if v >= 60:   return f"{v:.1f}%", "⚠️"
                  return f"{v:.1f}%", "❌"
              try: ms = float(math_s)
              except: ms = None
              try: cs = float(ckpt_s)
              except: cs = None
              mv, mg = grade(ms); cv, cg = grade(cs)
              f.write(f"| `mull_math_unit`   | {mg} {mv} |\n")
              f.write(f"| `mull_checkpoint`  | {cg} {cv} |\n")
              if avg is not None:
                  av, ag = grade(avg)
                  f.write(f"| **Average** | **{ag} {av}** |\n")
              f.write("\n> See `mull-reports` artifact for HTML report\n")

          if avg is None:
              print("⚠️  Score N/A — mull runner full output upar dekho (FULL MULL OUTPUT section)")
              print("   Next CI run mein format clear ho jaayega")
              sys.exit(0)  # non-blocking jab tak format confirm na ho
          elif avg < 60:
              print(f"❌ Poor: {avg:.1f}%")
          elif avg < 80:
              print(f"⚠️  OK: {avg:.1f}%")
          else:
              print(f"✅ Good: {avg:.1f}%")
          PYEOF

      - name: Upload MULL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mull-reports
          path: build/mull-report/
          if-no-files-found: warn
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════
  #  SUMMARY GATE
  # ═══════════════════════════════════════════════════════════════
  summary:
    name: "CI Summary"
    runs-on: ubuntu-22.04
    needs:
      - cpu-tests-linux
      - cpu-tests-windows
      - cpu-tests-macos
      - gpu-tests
      - linux-build
      - windows-build
      - macos-build
      - rapidcheck-tests
      - mutation-tests
    if: always()
    steps:
      - name: Print results + gate
        env:
          R_CPU_LX: ${{ needs.cpu-tests-linux.result }}
          R_CPU_WIN: ${{ needs.cpu-tests-windows.result }}
          R_CPU_MAC: ${{ needs.cpu-tests-macos.result }}
          R_GPU: ${{ needs.gpu-tests.result }}
          R_LX_BLD: ${{ needs.linux-build.result }}
          R_WIN_BLD: ${{ needs.windows-build.result }}
          R_MAC_BLD: ${{ needs.macos-build.result }}
          R_MULL: ${{ needs.mutation-tests.result }}
          R_RC: ${{ needs.rapidcheck-tests.result }}
        run: |
          echo "════════════════════════════════════════════════════"
          echo "  LOGOS CI Summary — v26-RapidCheck"
          echo "════════════════════════════════════════════════════"
          echo ""
          echo "  CPU Tests Linux:      $R_CPU_LX"
          echo "  CPU Tests Windows:    $R_CPU_WIN"
          echo "  CPU Tests macOS:      $R_CPU_MAC"
          echo "  GPU Tests (ctest):    $R_GPU"
          echo "  Linux Build + E2E:    $R_LX_BLD"
          echo "  Windows Build:        $R_WIN_BLD"
          echo "  macOS Build:          $R_MAC_BLD"
          echo "  RapidCheck Tests:     $R_RC (non-blocking)"
          echo "  MULL Mutation Tests:  $R_MULL (non-blocking)"
          echo "  Kaggle GPU Trigger:   async (non-blocking)"
          echo ""
          echo "  CTest coverage:"
          echo "    T2  Math Unit (CPU)"
          echo "    T2b Checkpoint roundtrip (CPU)"
          echo "    T4  Large Data Scale (CPU — all 3 platforms)"
          echo "    T1  Syntax Build  (GPU)"
          echo "    T3  Memory Stress (GPU)"
          echo "    T5  CUDA Kernels  (GPU)"
          echo "    T6  MULL Mutation (Linux, non-blocking)"
          echo "    T7  RapidCheck C++ property tests (Linux, non-blocking)"
          echo ""
          echo "  Sanitizer layers:"
          echo "    ASan+UBSan  → CPU test bugs (LOGOS_SANITIZE=ON)"
          echo "    compute-san → GPU memory errors (LOGOS_USE_COMPUTE_SANITIZER=ON)"
          echo "    MULL        → Test suite weakness (LOGOS_MUTATION_TEST=ON)"
          echo ""
          echo "════════════════════════════════════════════════════"
          echo ""
          echo "  Changes in v26 (RapidCheck):"
          echo "    ✅ hypothesis-tests job hataya — Python C++ re-implementation tha"
          echo "    ✅ rapidcheck-tests job add kiya — actual C++ headers directly test"
          echo "    ✅ LOGOS_RAPIDCHECK=ON cmake flag — FetchContent se rapidcheck"
          echo "    ✅ T7_RapidCheck CTest target — PROPERTY label"
          echo "    ✅ RC1-RC8: GEMM, tiling, bias, FreeEnergy, reshape, Riemannian, ckpt, leapfrog"
          echo "    ✅ Artifact: rapidcheck-results (log, 7 day retention)"
          echo ""
          echo "  Changes in v25 (MULL):"
          echo "    ✅ CMakeLists.txt: LOGOS_MUTATION_TEST=ON option added"
          echo "    ✅ mull.yml auto-generated in build dir (14 operators)"
          echo "    ✅ mull_math_unit target: test_math_unit M1-M16 mutations"
          echo "    ✅ mull_checkpoint target: T2b checkpoint roundtrip mutations"
          echo "    ✅ mull-run custom target: cmake --build --target mull-run"
          echo "    ✅ CI job: mutation-tests (continue-on-error: true)"
          echo "    ✅ Artifacts: mull-reports (HTML + log, 14 day retention)"
          echo "    ✅ Score gate: < 60% = warning, < 80% = improvement needed"
          echo ""
          echo "  Changes in v24:"
          echo "    ✅ UI FIX: training-pipeline renamed → linux-build"
          echo "    ✅ UNIFIED: All 3 CPU test jobs T4 timeout=600s"
          echo "    ✅ CLEANUP: Redundant T4 shell step removed from Linux job"
          echo ""
          echo "════════════════════════════════════════════════════"

          FAIL=false
          for r in "$R_CPU_LX" "$R_CPU_WIN" "$R_CPU_MAC" \
                   "$R_LX_BLD" "$R_WIN_BLD" "$R_MAC_BLD"; do
            [ "$r" = "failure" ] && FAIL=true
          done

          if [ "$R_GPU" = "failure" ]; then
            echo "⚠️  GPU tests failed (non-blocking if no CUDA runner)"
          fi
          if [ "$R_RC" = "failure" ]; then
            echo "⚠️  RapidCheck C++ property tests failed (non-blocking — check rapidcheck-results artifact)"
          fi
          if [ "$R_MULL" = "failure" ]; then
            echo "⚠️  MULL mutation tests failed (non-blocking — check mull-reports artifact)"
          fi

          if [ "$FAIL" = "true" ]; then
            echo "❌ FAILED — check individual job logs"
            exit 1
          fi
          echo "✅ ALL CRITICAL TESTS PASSED"
