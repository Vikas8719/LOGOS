name: LOGOS CI - Build Test Train (v8 Phase 1+2)

permissions:
  contents: read

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

# =============================================================
#  JOB 1: T2 Math Tests (CPU) - Linux / Windows / macOS
# =============================================================
  math-tests-linux:
    name: "T2 Math Tests - Linux"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 12 + CMake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives \
            --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 \
            --slave   /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Configure (CPU only)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20"

      - name: Build test_math_unit
        run: cmake --build build --target test_math_unit --parallel $(nproc)

      - name: Run T2 Math Tests
        run: |
          ./build/test_math_unit
          echo "Exit code: $?"

      - name: Run CPU logos tests
        run: |
          cmake --build build --target logos --parallel $(nproc)
          ./build/logos --test
          ./build/logos --forward
          ./build/logos --benchmark

  math-tests-windows:
    name: "T2 Math Tests - Windows"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20"

      - name: Build test_math_unit
        run: cmake --build build --target test_math_unit --parallel 4

      - name: Run T2 Math Tests
        run: .\build\test_math_unit.exe

  math-tests-macos:
    name: "T2 Math Tests - macOS ARM64"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O2 -std=c++20"

      - name: Build test_math_unit
        run: cmake --build build --target test_math_unit --parallel $(sysctl -n hw.logicalcpu)

      - name: Run T2 Math Tests
        run: ./build/test_math_unit

# =============================================================
#  JOB 2: T1 + T3 - GPU Tests (Syntax + Memory Stress)
# =============================================================
  gpu-tests:
    name: "T1+T3 GPU Tests (Syntax + Memory Stress)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives \
            --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 \
            --slave   /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Check for CUDA
        id: cuda_check
        run: |
          if command -v nvcc &>/dev/null; then
            echo "cuda_available=true" >> $GITHUB_OUTPUT
            nvcc --version
            nvidia-smi
          else
            echo "cuda_available=false" >> $GITHUB_OUTPUT
            echo "No CUDA found - GPU tests will be skipped"
          fi

      - name: Configure (with CUDA if available)
        run: |
          if [ "${{ steps.cuda_check.outputs.cuda_available }}" = "true" ]; then
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=g++-12 \
              -DCUDA_ARCH_MODE=native \
              -DCMAKE_CUDA_FLAGS="--extended-lambda"
          else
            cmake -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=g++-12 \
              -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20"
          fi

      - name: Build CPU targets
        run: cmake --build build --target logos test_math_unit --parallel $(nproc)

      - name: Build GPU targets (if CUDA available)
        if: steps.cuda_check.outputs.cuda_available == 'true'
        run: |
          cmake --build build \
            --target logos_gpu test_syntax_build test_memory_stress \
            --parallel $(nproc)

      - name: Run T1 - Syntax and Build Tests (GPU)
        if: steps.cuda_check.outputs.cuda_available == 'true'
        run: |
          echo "TEST 1: Syntax and Build"
          ./build/test_syntax_build
          echo "T1 exit: $?"

      - name: Run T3 - Memory and Bounds Stress (GPU)
        if: steps.cuda_check.outputs.cuda_available == 'true'
        run: |
          echo "TEST 3: Memory and Bounds Stress"
          ./build/test_memory_stress
          echo "T3 exit: $?"

      - name: GPU tests skipped (no CUDA)
        if: steps.cuda_check.outputs.cuda_available == 'false'
        run: |
          echo "GPU tests skipped - run on Kaggle notebook"
          echo "CPU math test on same machine:"
          ./build/test_math_unit
          echo "Math tests passed on CPU"

      - name: cuda-memcheck on T3 (if CUDA available)
        if: steps.cuda_check.outputs.cuda_available == 'true'
        continue-on-error: true
        run: |
          if command -v compute-sanitizer &>/dev/null; then
            echo "Running compute-sanitizer on memory stress test..."
            timeout 300 compute-sanitizer \
              --tool memcheck \
              --leak-check full \
              --error-exitcode 1 \
              ./build/test_memory_stress \
              2>&1 | tail -50
          elif command -v cuda-memcheck &>/dev/null; then
            echo "Running cuda-memcheck on memory stress test..."
            timeout 300 cuda-memcheck \
              --leak-check full \
              ./build/test_memory_stress \
              2>&1 | tail -50
          else
            echo "Neither compute-sanitizer nor cuda-memcheck found"
          fi

# =============================================================
#  JOB 3: Full Training + Eval Pipeline (Linux, CPU)
# =============================================================
  training-pipeline:
    name: "Training Pipeline - CPU E2E"
    runs-on: ubuntu-22.04
    needs: [math-tests-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 12
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives \
            --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 \
            --slave   /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Configure + Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O3 -march=x86-64 -std=c++20"
          cmake --build build --parallel $(nproc)

      - name: Run T2 (on training runner)
        run: ./build/test_math_unit

      - name: Download dataset
        run: |
          EXPECTED_SHA="f2d94a6b46fe8c4d01e7bc4be49e5e7cd04cb47aec3a1dce17f8e37e72e16b51"
          DOWNLOAD_OK=false

          curl -L \
            "https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt" \
            --max-filesize 5242880 \
            -o dataset_raw.txt \
            --fail --silent --show-error \
            && DOWNLOAD_OK=true \
            || echo "Download failed - synthetic fallback"

          if [ "$DOWNLOAD_OK" = "true" ] && [ -s dataset_raw.txt ]; then
            ACTUAL_SHA=$(sha256sum dataset_raw.txt | awk '{print $1}')
            if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
              echo "SHA-256 mismatch - falling back to synthetic"
              echo "Expected: $EXPECTED_SHA"
              echo "Actual:   $ACTUAL_SHA"
              DOWNLOAD_OK=false
            else
              echo "Dataset verified: $ACTUAL_SHA"
              head -c 1048576 dataset_raw.txt > dataset.txt
            fi
          fi

          if [ "$DOWNLOAD_OK" = "false" ] || [ ! -s dataset.txt ]; then
            python3 -c "
import random
random.seed(42)
words=['the','cat','sat','on','mat','a','dog','ran','fast','slow',
       'big','small','red','blue','green','happy','sad','old','new',
       'Once','upon','time','there','was','little','girl','named','Lily']
lines=[]
for _ in range(5000):
    n=random.randint(10,30)
    lines.append(' '.join(random.choices(words,k=n))+'.')
print('\n'.join(lines))
" > dataset.txt
            echo "Using synthetic dataset"
          fi
          echo "Dataset size: $(wc -c < dataset.txt) bytes"

      - name: Train (200 steps CI mini-run)
        run: |
          timeout 180 ./build/logos --train dataset.txt
          echo "Training exit: $?"
          ls -la *.bin 2>/dev/null || echo "No checkpoint (normal for short run)"

      - name: Evaluate
        run: ./build/logos --eval dataset.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logos-linux-training
          path: |
            build/logos
            build/test_math_unit
            *.bin
          if-no-files-found: ignore
          retention-days: 7

# =============================================================
#  JOB 4: Windows Build + T2
# =============================================================
  windows-build:
    name: "Windows Build + T2"
    runs-on: windows-latest
    needs: [math-tests-windows]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build `
            -G "MinGW Makefiles" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_FLAGS="-O3 -march=x86-64 -std=c++20"

      - name: Build all CPU targets
        run: cmake --build build --parallel 4

      - name: Unit Tests
        run: .\build\logos.exe --test

      - name: T2 Math Tests
        run: .\build\test_math_unit.exe

      - name: Forward + Benchmark
        run: |
          .\build\logos.exe --forward
          .\build\logos.exe --benchmark

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: logos-windows-x86_64
          path: |
            build/logos.exe
            build/test_math_unit.exe
          retention-days: 7

# =============================================================
#  JOB 5: macOS Build + T2
# =============================================================
  macos-build:
    name: "macOS ARM64 Build + T2"
    runs-on: macos-14
    needs: [math-tests-macos]
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O3 -std=c++20"

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: Tests
        run: |
          ./build/logos --test
          ./build/logos --forward
          ./build/logos --benchmark

      - name: T2 Math Tests
        run: ./build/test_math_unit

      - name: Upload macOS binary
        uses: actions/upload-artifact@v4
        with:
          name: logos-macos-arm64
          path: |
            build/logos
            build/test_math_unit
          retention-days: 7

# =============================================================
#  JOB 6: Kaggle GPU Notebook Trigger
# =============================================================
  kaggle-gpu-trigger:
    name: "Kaggle GPU Test Trigger"
    runs-on: ubuntu-22.04
    needs: [math-tests-linux]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Kaggle CLI
        run: pip install kaggle --quiet

      - name: Trigger Kaggle GPU notebook
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "Kaggle secrets not configured"
            echo "Add KAGGLE_USERNAME and KAGGLE_KEY to repo secrets"
            exit 0
          fi
          mkdir -p ~/.kaggle
          echo '{"username":"'"$KAGGLE_USERNAME"'","key":"'"$KAGGLE_KEY"'"}' \
            > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json
          echo "Kaggle API configured - notebook push would go here"

# =============================================================
#  SUMMARY
# =============================================================
  summary:
    name: "CI Summary"
    runs-on: ubuntu-22.04
    needs:
      - math-tests-linux
      - math-tests-windows
      - math-tests-macos
      - gpu-tests
      - training-pipeline
      - windows-build
      - macos-build
    if: always()
    steps:
      - name: Print results
        run: |
          echo "================================================"
          echo "  LOGOS CI Summary (v8 Phase 1+2)"
          echo "================================================"
          echo "  T2 Math (Linux):   ${{ needs.math-tests-linux.result }}"
          echo "  T2 Math (Windows): ${{ needs.math-tests-windows.result }}"
          echo "  T2 Math (macOS):   ${{ needs.math-tests-macos.result }}"
          echo "  T1+T3 GPU:         ${{ needs.gpu-tests.result }}"
          echo "  Training Pipeline: ${{ needs.training-pipeline.result }}"
          echo "  Windows Build:     ${{ needs.windows-build.result }}"
          echo "  macOS Build:       ${{ needs.macos-build.result }}"
          echo "------------------------------------------------"
          echo "  T1 Syntax+Build:  CUDA kernels, GPU ops"
          echo "  T2 Math Unit:     Vedic vs modern math"
          echo "  T3 Memory Stress: 1M+, VRAM, bounds"
          echo "================================================"

          CRITICAL_FAIL=false
          for result in \
            "${{ needs.math-tests-linux.result }}" \
            "${{ needs.math-tests-windows.result }}" \
            "${{ needs.math-tests-macos.result }}" \
            "${{ needs.training-pipeline.result }}" \
            "${{ needs.windows-build.result }}" \
            "${{ needs.macos-build.result }}"; do
            if [ "$result" = "failure" ]; then
              CRITICAL_FAIL=true
            fi
          done

          if [ "${{ needs.gpu-tests.result }}" = "failure" ]; then
            echo "WARNING: GPU tests failed - check if GPU runner is available"
          fi

          if [ "$CRITICAL_FAIL" = "true" ]; then
            echo ""
            echo "FAILED: One or more critical jobs failed."
            echo ""
            echo "Fix guide:"
            echo "  T2 Math failures   -> check tests/test_math_unit.cpp"
            echo "  T1 Syntax failures -> check cuda/VedicGEMM.cu + ModelGPU.cu"
            echo "  T3 Memory failures -> check cuda/ModelGPU.cu free_layer_cache()"
            echo "  Training failures  -> check src/main.cpp run_training()"
            exit 1
          fi

          echo "PASSED: All critical jobs passed."
