name: LOGOS CI v28-KaggleFix

permissions:
  contents: read
  actions: write   # kaggle-gpu-trigger: workflow_dispatch trigger ke liye

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────
#  JOB OVERVIEW  (v26 — Hypothesis → RapidCheck C++ replaced)
#  ┌──────────────────────────────────────────────────────────────┐
#  │  cpu-tests-linux   → T2 Math + T2b Checkpoint + T4 LDS      │
#  │  sanitizer-tests-linux → T2 + T2b under ASan + UBSan       │
#  │  cpu-tests-windows → T2 Math + T2b Checkpoint + T4 LDS      │
#  │  cpu-tests-macos   → T2 Math + T2b Checkpoint + T4 LDS      │
  #  │  gpu-tests         → T1+T2 GPU+T3+T4+T5 via ctest -L GPU    │
#  │  rapidcheck-tests  → T7 RapidCheck C++ property tests       │
#  │  mutation-tests    → T6 MULL (clang++, non-blocking)        │
#  │  linux-build       → full Linux build + E2E smoke            │
#  │  windows-build     → full Windows build smoke                │
#  │  macos-build       → full macOS build smoke                  │
#  │  kaggle-gpu-trigger→ async Kaggle GPU notebook push          │
#  │  summary           → final CI gate                           │
#  └──────────────────────────────────────────────────────────────┘
#
#  Sanitizer layers:
#    ASan+UBSan  : cmake -DLOGOS_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
#    compute-san : cmake -DLOGOS_USE_COMPUTE_SANITIZER=ON
#    MULL        : cmake -DLOGOS_MUTATION_TEST=ON -DCMAKE_CXX_COMPILER=clang++
#                  cmake --build build --target mull-run
# ─────────────────────────────────────────────────────────────────

jobs:
  # ═══════════════════════════════════════════════════════════════
  #  CPU TESTS — Linux
  #  T2_Math_Unit + T2b_Checkpoint + T4_Large_Data_Scale
  # ═══════════════════════════════════════════════════════════════
  cpu-tests-linux:
    name: "CPU Tests — Linux (T2 + T2b + T4)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives --install /usr/bin/gcc gcc \
            /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Configure (CPU-only)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20"

      - name: Build CPU targets
        run: |
          cmake --build build \
            --target test_math_unit test_checkpoint test_large_data_scale logos \
            --parallel $(nproc)

      - name: CTest — T2 Math + T2b Checkpoint + T4 Large Data Scale
        working-directory: build
        run: ctest --output-on-failure -LE "GPU" --timeout 600 -j 1

  # ═══════════════════════════════════════════════════════════════
  #  CPU SANITIZERS — Linux (ASan + UBSan)
  #  Run after the regular Linux CPU suite; failures block the CI gate.
  # ═══════════════════════════════════════════════════════════════
  sanitizer-tests-linux:
    name: "ASan + UBSan — Linux (T2 + T2b)"
    runs-on: ubuntu-22.04
    needs: [cpu-tests-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build

      - name: Configure (Debug + ASan + UBSan)
        run: |
          cmake -B build-sanitize -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DLOGOS_SANITIZE=ON

      - name: Build sanitized CPU test targets
        run: |
          cmake --build build-sanitize \
            --target test_math_unit test_checkpoint \
            --parallel $(nproc)

      - name: Run T2 + T2b with ASan + UBSan
        working-directory: build-sanitize
        run: |
          ctest --output-on-failure \
            -R "^(T2_Math_Unit|T2b_Checkpoint)$" \
            --timeout 120 \
            -j 1

  # ═══════════════════════════════════════════════════════════════
  #  CPU TESTS — Windows
  #  NOTE: PowerShell does NOT support backslash line continuation.
  # ═══════════════════════════════════════════════════════════════
  cpu-tests-windows:
    name: "CPU Tests — Windows (T2 + T2b + T4)"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20"

      - name: Build
        run: cmake --build build --target test_math_unit test_checkpoint test_large_data_scale --parallel 4

      - name: CTest — T2 Math + T2b Checkpoint + T4 Large Data Scale
        working-directory: build
        run: ctest --output-on-failure -LE "GPU" --timeout 600

  # ═══════════════════════════════════════════════════════════════
  #  CPU TESTS — macOS
  # ═══════════════════════════════════════════════════════════════
  cpu-tests-macos:
    name: "CPU Tests — macOS (T2 + T2b + T4)"
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-O2 -std=c++20"

      - name: Build
        run: cmake --build build --target test_math_unit test_checkpoint test_large_data_scale --parallel $(sysctl -n hw.logicalcpu)

      - name: CTest — T2 Math + T2b Checkpoint + T4 Large Data Scale
        working-directory: build
        run: ctest --output-on-failure -LE "GPU" --timeout 600

  # ═══════════════════════════════════════════════════════════════
  #  GPU TESTS
  #  Runs T1+T2 GPU+T3+T4+T5 via: ctest -L GPU --output-on-failure
  # ═══════════════════════════════════════════════════════════════
  gpu-tests:
    name: "GPU Tests (T1+T2 GPU+T3+T4+T5 via ctest)"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives --install /usr/bin/gcc gcc \
            /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Detect CUDA
        id: cuda
        run: |
          if command -v nvcc &>/dev/null; then
            VER=$(nvcc --version | grep "release" | awk '{print $5}' | tr -d ',')
            echo "available=true"  >> $GITHUB_OUTPUT
            echo "version=$VER"    >> $GITHUB_OUTPUT
            echo "✅ CUDA $VER found"
          else
            echo "available=false" >> $GITHUB_OUTPUT
            echo "⚠️  No CUDA — GPU tests will be skipped (non-blocking)"
          fi

      - name: Configure (with CUDA)
        if: steps.cuda.outputs.available == 'true'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCUDA_ARCH_MODE=native

      - name: Configure (CPU fallback)
        if: steps.cuda.outputs.available == 'false'
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20"

      - name: Build all GPU targets
        if: steps.cuda.outputs.available == 'true'
        run: |
          cmake --build build \
            --target logos_gpu \
                     test_syntax_build \
                     test_math_units_gpu \
                     test_math_unit \
                     test_memory_stress \
                     test_large_data_scale \
                     test_cuda_kernels \
            --parallel $(nproc)

      - name: Build CPU fallback targets
        if: steps.cuda.outputs.available == 'false'
        run: |
          cmake --build build \
            --target logos test_math_unit test_checkpoint test_large_data_scale \
            --parallel $(nproc)

      - name: CTest — GPU tests (T1 T2 T3 T4 T5)
        if: steps.cuda.outputs.available == 'true'
        working-directory: build
        run: |
          ctest --output-on-failure \
                -L "GPU" \
                --timeout 600 \
                -j 1 \
                --test-output-size-passed 8192 \
                --test-output-size-failed 65536

      - name: CTest — CPU fallback (no CUDA runner)
        if: steps.cuda.outputs.available == 'false'
        working-directory: build
        run: ctest --output-on-failure -LE "GPU" --timeout 600 -j 1

      - name: compute-sanitizer memcheck on T5
        if: steps.cuda.outputs.available == 'true'
        continue-on-error: true
        run: |
          if command -v compute-sanitizer &>/dev/null; then
            timeout 300 compute-sanitizer \
              --tool memcheck --leak-check full --error-exitcode 1 \
              ./build/test_cuda_kernels 2>&1 | tail -80
          else
            echo "compute-sanitizer not available"
          fi

      - name: Upload CTest results
        if: always() && steps.cuda.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ctest-results-gpu
          path: build/Testing/
          if-no-files-found: ignore
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  #  LINUX BUILD — Full build + E2E training smoke
  #  (Replaces old training-pipeline job — now visible in UI)
  # ═══════════════════════════════════════════════════════════════
  linux-build:
    name: "Linux Build + E2E Training"
    runs-on: ubuntu-22.04
    needs: [cpu-tests-linux]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build
          sudo update-alternatives --install /usr/bin/gcc gcc \
            /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Configure and Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O3 -march=x86-64 -std=c++20"
          cmake --build build --parallel $(nproc)

      - name: logos CPU smoke
        run: |
          ./build/logos --test
          ./build/logos --forward
          ./build/logos --benchmark

      - name: Prepare dataset
        run: |
          curl -L "https://huggingface.co/datasets/roneneldan/TinyStories/resolve/main/TinyStoriesV2-GPT4-train.txt" \
            --max-filesize 524288 -o dataset_raw.txt --fail --silent --show-error \
            && head -c 102400 dataset_raw.txt > dataset.txt \
            || python3 -c "
          import random; random.seed(42)
          w=['the','cat','sat','on','mat','a','dog','ran','fast','slow','big','small','red','blue','Once','upon','time','there','was','little','girl','named','Lily']
          print('\n'.join([' '.join(random.choices(w,k=random.randint(10,30)))+'.' for _ in range(500)]))" > dataset.txt
          echo "Dataset: $(wc -c < dataset.txt) bytes"

      - name: Train
        run: timeout 600 ./build/logos --train dataset.txt || true

      - name: Evaluate
        run: ./build/logos --eval dataset.txt || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logos-linux
          path: |
            build/logos
            build/test_math_unit
            *.bin
          if-no-files-found: ignore
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  #  WINDOWS BUILD
  # ═══════════════════════════════════════════════════════════════
  windows-build:
    name: "Windows Build"
    runs-on: windows-latest
    needs: [cpu-tests-windows]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-O3 -march=x86-64 -std=c++20"

      - name: Build
        run: cmake --build build --parallel 4

      - name: CTest CPU
        working-directory: build
        run: ctest --output-on-failure -LE "GPU" --timeout 600

      - name: logos smoke
        run: |
          .\build\logos.exe --test
          .\build\test_math_unit.exe
          .\build\logos.exe --forward
          .\build\logos.exe --benchmark

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: logos-windows
          path: |
            build/logos.exe
            build/test_math_unit.exe
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  #  macOS BUILD
  # ═══════════════════════════════════════════════════════════════
  macos-build:
    name: "macOS Build"
    runs-on: macos-14
    needs: [cpu-tests-macos]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-O3 -std=c++20"

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.logicalcpu)

      - name: CTest CPU
        working-directory: build
        run: ctest --output-on-failure -LE "GPU" --timeout 600

      - name: logos smoke
        run: |
          ./build/logos --test
          ./build/test_math_unit
          ./build/logos --forward
          ./build/logos --benchmark

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: logos-macos
          path: |
            build/logos
            build/test_math_unit
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════
  #  RAPIDCHECK — C++ Property-Based Tests (T7)
  #  Hypothesis (Python) ko replace kiya — woh C++ ka Python re-implementation tha.
  #  RapidCheck actual C++ headers directly include karta hai:
  #    VedicGEMM.hpp, Tensor.hpp, PhysicsOpt.hpp, Checkpoint.hpp, LayerNorm.hpp
  #  Tests:
  #    RC1: VedicGEMM == reference (random sizes + values)
  #    RC2: VEDIC_BLOCK=64 boundary (63,64,65,128,129)
  #    RC3: vedic_gemm_bias correctness
  #    RC4: Free Energy F=CE-T*S properties
  #    RC5: Tensor reshape roundtrip
  #    RC6: Riemannian distance symmetry, self=0, triangle
  #    RC7: Checkpoint size formula (random ModelConfig)
  #    RC8: Leapfrog energy drift < Euler drift
  #  Non-blocking: continue-on-error: true
  # ═══════════════════════════════════════════════════════════════
  rapidcheck-tests:
    name: "RapidCheck C++ Property Tests (T7)"
    runs-on: ubuntu-22.04
    needs: [cpu-tests-linux]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build git
          sudo update-alternatives --install /usr/bin/gcc gcc \
            /usr/bin/gcc-12 100 --slave /usr/bin/g++ g++ /usr/bin/g++-12

      - name: Configure (LOGOS_RAPIDCHECK=ON — FetchContent se rapidcheck download hoga)
        run: |
          cmake -B build_rc -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-12 \
            -DCMAKE_CXX_FLAGS="-O2 -march=x86-64 -std=c++20" \
            -DLOGOS_RAPIDCHECK=ON

      - name: Build test_rapidcheck
        run: |
          cmake --build build_rc \
            --target test_rapidcheck \
            --parallel $(nproc)
        env:
          # Agar build mein CUDA nahi hai toh bhi test_rapidcheck target hona chahiye
          # (CPU-only branch mein LOGOS_RAPIDCHECK=ON se yeh target define hota hai)
          NINJA_STATUS: "[%f/%t] "

      - name: Run RapidCheck property tests (T7)
        id: rc_run
        run: |
          # RC_PARAMS format: key=value pairs, semicolon-separated
          # max_success=1000  : 1000 random cases per property (was 500 — too lenient)
          # max_discard_ratio=10 : RC_PRE rejections limit (10x max_success se zyada = fail)
          # noshrink=0        : counterexample shrinking ON — reproducible min-case milta hai
          # seed alag nahi set kiya — har run different random seed use karega
          # Agar failure ho toh seed output mein dikhega — wahi seed re-run mein use karo:
          #   RC_PARAMS="max_success=1000;seed=<N>" ./test_rapidcheck
          RC_PARAMS="max_success=1000;max_discard_ratio=10" \
            ./build_rc/test_rapidcheck 2>&1 | tee rc_output.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: RapidCheck Summary
        if: always()
        run: |
          echo "════════════════════════════════════════════════════"
          echo "  RapidCheck C++ Property Test Results (T7)"
          echo "  Strict: max_success=1000 per property"
          echo "════════════════════════════════════════════════════"
          grep -E "(RC[0-9]|✅|❌|PASSED|FAILED|passed|failed)" rc_output.log || true
          echo "════════════════════════════════════════════════════"

          python3 - <<'PYEOF'
          import os, re
          log = open("rc_output.log").read() if os.path.exists("rc_output.log") else ""
          passed = log.count("✅")
          failed = log.count("❌")
          total  = passed + failed
          emoji  = "✅" if failed == 0 else "❌"

          # RC_PARAMS seed extract karo agar failure mein printed hai
          seed_match = re.search(r'(?:seed|Seed)[=:\s]+(\d+)', log)
          seed_info  = f"Seed: `{seed_match.group(1)}`" if seed_match else "Seed: random (set RC_PARAMS=seed=N to reproduce)"

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stderr")
          with open(summary_path, "a") as f:
              f.write("## 🔬 RapidCheck C++ Property Tests — T7\n\n")
              f.write(f"> **Strict mode**: `max_success=1000` per property, `max_discard_ratio=10`\n")
              f.write(f"> {seed_info}\n\n")
              f.write("| Test | Result |\n")
              f.write("|------|--------|\n")
              for line in log.splitlines():
                  # Match RC1..RC8b lines with result icon
                  if re.search(r'RC\d', line) and ("✅" in line or "❌" in line):
                      icon = "✅" if "✅" in line else "❌"
                      f.write(f"| `{line.strip()}` | {icon} |\n")
              f.write(f"\n**Overall: {emoji} {passed}/{total} passed**\n\n")
              f.write("Properties tested:\n")
              f.write("- RC1: VedicGEMM == naive_gemm (1000 random sizes+values)\n")
              f.write("- RC2: VEDIC_BLOCK=64 tiling boundary (200 × 9 sizes = 1800 matrices)\n")
              f.write("- RC3: vedic_gemm_bias == GEMM+bias (1000 cases)\n")
              f.write("- RC4a-d: Free Energy F=CE-T*S properties (1000 each)\n")
              f.write("- RC5: Tensor reshape roundtrip (1000 cases)\n")
              f.write("- RC6a-d: Riemannian distance axioms (1000 each)\n")
              f.write("- RC7: Checkpoint serialized size formula (1000 configs)\n")
              f.write("- RC8a: Leapfrog drift < Euler drift (1000 cases, lr<0.5)\n")
              f.write("- RC8b: Leapfrog drift < 1% for small lr (1000 cases, lr<0.1)\n")
          PYEOF

      - name: Upload RapidCheck results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapidcheck-results
          path: rc_output.log
          if-no-files-found: ignore
          retention-days: 7

    # ═══════════════════════════════════════════════════════════════
  #  MULL MUTATION TESTING
  #  Test suite ki weakness dhundta hai:
  #    - src/VedicGEMM.cpp, src/Checkpoint.cpp
  #    - include/Tensor.hpp, PhysicsOpt.hpp, LayerNorm.hpp, Attention.hpp
  #  Target: Mutation score > 80% (90%+ excellent)
  #  Runtime: ~10-20 min (sabhi mutants × dono test binaries)
  #  Non-blocking: continue-on-error: true (CI block nahi karta)
  # ═══════════════════════════════════════════════════════════════
  mutation-tests:
    name: "MULL Mutation Tests (T6)"
    runs-on: ubuntu-22.04
    needs: [cpu-tests-linux]
    continue-on-error: true # mutation score gap se CI block nahi hoga
    steps:
      - uses: actions/checkout@v4

      - name: Install gcc-12, clang-15, LLVM-15, and MULL-15
        run: |
          # ── gcc-12 PEHLE install karo ────────────────────────────
          # Zaruri hai: clang-15 ubuntu-22.04 pe GCC ka libstdc++ use karta hai.
          # GCC-14 (default) ke saath clang-15 ka ABI mismatch hota hai —
          # std::__shared_ptr<_Dir>::operator bool() GCC-14 mein inline ho gaya
          # aur .so mein exist nahi karta, isliye undefined reference aata hai.
          # GCC-12 ke saath yeh symbol available hai.
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-12 g++-12 cmake ninja-build

          # ── clang-15 + llvm-15 (LLVM apt repo se) ──────────────
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] \
            http://apt.llvm.org/jammy/ llvm-toolchain-jammy-15 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list

          # ── MULL Cloudsmith repo ─────────────────────────────────
          # mull-17 sirf Ubuntu 24.04 Noble pe hai
          # Ubuntu 22.04 Jammy pe mull-15 latest stable hai (Cloudsmith se)
          curl -1sLf \
            'https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh' \
            | sudo -E distro=ubuntu codename=jammy bash

          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-15 llvm-15 mull-15

          # symlinks — CMake find_program aur clang++ ko path milega
          sudo ln -sf /usr/bin/clang-15    /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-15  /usr/local/bin/clang++
          sudo ln -sf /usr/bin/mull-runner-15 /usr/local/bin/mull-runner

          # verify: gcc-12 crtbeginS.o available hai (clang ko yahi chahiye)
          echo "GCC-12 crtbeginS.o: $(g++-12 -print-file-name=crtbeginS.o)"
          ls $(g++-12 -print-file-name=crtbeginS.o)
          clang++ --version | head -1
          mull-runner --version 2>&1 | head -1


      - name: Configure (MULL + Debug + clang++ + GCC-12 sysroot)
        run: |
          GCC12_PREFIX=/usr
          echo "GCC-12 prefix: ${GCC12_PREFIX}"
          ls /usr/bin/g++-12
          ls /usr/lib/gcc/x86_64-linux-gnu/12/crtbeginS.o

          # mull-15 IR frontend plugin — mutations inject karne ke liye ZARURI hai
          # Without this: "No mutants found. Mutation score: infinitely high"
          # Plugin path verified from mull docs + mull-15 package contents
          MULL_PLUGIN=""
          for p in \
            /usr/lib/mull-ir-frontend-15 \
            /usr/lib/mull-ir-frontend-15.so \
            /usr/lib/x86_64-linux-gnu/mull-ir-frontend-15 \
            /usr/local/lib/mull-ir-frontend-15 \
            /usr/lib/llvm-15/lib/mull-ir-frontend-15.so; do
            if [ -f "$p" ]; then MULL_PLUGIN="$p"; break; fi
          done
          # dpkg fallback
          if [ -z "$MULL_PLUGIN" ]; then
            MULL_PLUGIN=$(dpkg -L mull-15 2>/dev/null | grep -E "mull-ir-frontend" | head -1)
          fi
          echo "MULL plugin: '${MULL_PLUGIN:-NOT FOUND}'"
          ls -la "$MULL_PLUGIN" 2>/dev/null || echo "Plugin file not found at above path"

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLOGOS_MUTATION_TEST=ON \
            -DCMAKE_CXX_FLAGS="--gcc-toolchain=${GCC12_PREFIX}" \
            -DMULL_PASS_PLUGIN="${MULL_PLUGIN}"

      - name: Build mutation targets
        run: |
          cmake --build build \
            --target mull_math_unit mull_checkpoint \
            --parallel $(nproc)

      - name: Check mull-runner version + output format
        run: |
          echo "=== mull-runner version ==="
          mull-runner --version 2>&1 || mull-runner -version 2>&1 || true
          echo "=== mull-runner help (first 20 lines) ==="
          mull-runner --help 2>&1 | head -20 || true

      - name: Diagnose mull-runner + binaries
        run: |
          echo "=== mull-runner full path ==="
          which mull-runner || echo "NOT IN PATH"
          ls -la /usr/local/bin/mull-runner || true
          ls -la /usr/bin/mull-runner-15 || true

          echo "=== Built binaries ==="
          ls -la build/mull_math_unit build/mull_checkpoint 2>&1 || echo "BINARIES NOT FOUND"

          echo "=== Binary execute test ==="
          ./build/mull_math_unit 2>&1 | head -5 || echo "Binary execute failed with $?"
          ./build/mull_checkpoint 2>&1 | head -5 || echo "Binary execute failed with $?"

          echo "=== mull-runner full --help ==="
          mull-runner --help 2>&1 || true

          echo "=== runner-discovered MULL config files ==="
          cat build/mull-report/math-run/mull.yml 2>&1 || echo "math mull.yml not found"
          cat build/mull-report/checkpoint-run/mull.yml 2>&1 || echo "checkpoint mull.yml not found"

      - name: Run MULL — test_math_unit (M1-M16)
        id: mull_math
        continue-on-error: true
        run: |
          mkdir -p build/mull-report/math build/mull-report/math-run

          echo "--- Collecting LLVM coverage for math tests ---"
          LLVM_PROFILE_FILE="$GITHUB_WORKSPACE/build/mull-report/math-run/coverage.profraw" \
            "$GITHUB_WORKSPACE/build/mull_math_unit" > /dev/null
          llvm-profdata-15 merge -sparse \
            "$GITHUB_WORKSPACE/build/mull-report/math-run/coverage.profraw" \
            -o "$GITHUB_WORKSPACE/build/mull-report/math-run/coverage.profdata"

          echo "--- Running mull-runner on mull_math_unit ---"
          (
            cd build/mull-report/math-run
            mull-runner \
            --workers 2 \
            --timeout 30000 \
            --report-dir "$GITHUB_WORKSPACE/build/mull-report/math" \
            --coverage-info "$GITHUB_WORKSPACE/build/mull-report/math-run/coverage.profdata" \
            --ld-search-path "$GITHUB_WORKSPACE/build" \
            "$GITHUB_WORKSPACE/build/mull_math_unit" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/mull-report/math/runner.log"
          ) || true

          LOG=build/mull-report/math/runner.log

          echo "════ FULL MULL OUTPUT (math) ════"
          cat "$LOG"
          echo "════ END MULL OUTPUT (math) ════"

          # Format 1: "Mutation score: 85.71%"
          SCORE=$(grep -oP 'Mutation score: \K[\d.]+' "$LOG" 2>/dev/null | tail -1)

          # "infinitely high" = 0 mutants found = instrumentation missing
          if [ -z "$SCORE" ] && grep -q "infinitely high" "$LOG" 2>/dev/null; then
            echo "❌ No mutants found — check compile flags"
            SCORE="N/A"
          fi

          # Format 2: "Killed: 12 out of 14"
          if [ -z "$SCORE" ]; then
            KILLED=$(grep -oP 'Killed:\s*\K\d+' "$LOG" 2>/dev/null | tail -1)
            TOTAL=$(grep -oP 'out of\s*\K\d+' "$LOG" 2>/dev/null | tail -1)
            if [ -n "$KILLED" ] && [ -n "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              SCORE=$(python3 -c "print(f'{100*int(\"$KILLED\")/int(\"$TOTAL\"):.1f}')")
            fi
          fi

          # Format 3: "Killed mutants: 12 / 14"
          if [ -z "$SCORE" ]; then
            KILLED=$(grep -oP '[Kk]illed mutants?:\s*\K\d+' "$LOG" 2>/dev/null | tail -1)
            TOTAL=$(grep -oP '[Kk]illed mutants?:\s*\d+\s*/\s*\K\d+' "$LOG" 2>/dev/null | tail -1)
            if [ -n "$KILLED" ] && [ -n "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              SCORE=$(python3 -c "print(f'{100*int(\"$KILLED\")/int(\"$TOTAL\"):.1f}')")
            fi
          fi

          # Format 4: any percentage in log
          if [ -z "$SCORE" ]; then
            SCORE=$(grep -oP '\b\d+\.?\d*(?=%)' "$LOG" 2>/dev/null | tail -1)
          fi

          echo "Parsed math score: '${SCORE:-NOT_FOUND}'"
          echo "score=${SCORE:-N/A}" >> $GITHUB_OUTPUT

      - name: Run MULL — test_checkpoint (T2b)
        id: mull_ckpt
        continue-on-error: true
        run: |
          mkdir -p build/mull-report/checkpoint build/mull-report/checkpoint-run

          echo "--- Collecting LLVM coverage for checkpoint tests ---"
          LLVM_PROFILE_FILE="$GITHUB_WORKSPACE/build/mull-report/checkpoint-run/coverage.profraw" \
            "$GITHUB_WORKSPACE/build/mull_checkpoint" > /dev/null
          llvm-profdata-15 merge -sparse \
            "$GITHUB_WORKSPACE/build/mull-report/checkpoint-run/coverage.profraw" \
            -o "$GITHUB_WORKSPACE/build/mull-report/checkpoint-run/coverage.profdata"

          echo "--- Running mull-runner on mull_checkpoint ---"
          (
            cd build/mull-report/checkpoint-run
            mull-runner \
            --workers 2 \
            --timeout 30000 \
            --report-dir "$GITHUB_WORKSPACE/build/mull-report/checkpoint" \
            --coverage-info "$GITHUB_WORKSPACE/build/mull-report/checkpoint-run/coverage.profdata" \
            --ld-search-path "$GITHUB_WORKSPACE/build" \
            "$GITHUB_WORKSPACE/build/mull_checkpoint" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/mull-report/checkpoint/runner.log"
          ) || true

          LOG=build/mull-report/checkpoint/runner.log

          echo "════ FULL MULL OUTPUT (checkpoint) ════"
          cat "$LOG"
          echo "════ END MULL OUTPUT (checkpoint) ════"

          SCORE=$(grep -oP 'Mutation score: \K[\d.]+' "$LOG" 2>/dev/null | tail -1)
          if [ -z "$SCORE" ] && grep -q "infinitely high" "$LOG" 2>/dev/null; then
            SCORE="N/A"
          fi
          if [ -z "$SCORE" ]; then
            KILLED=$(grep -oP 'Killed:\s*\K\d+' "$LOG" 2>/dev/null | tail -1)
            TOTAL=$(grep -oP 'out of\s*\K\d+' "$LOG" 2>/dev/null | tail -1)
            if [ -n "$KILLED" ] && [ -n "$TOTAL" ] && [ "$TOTAL" -gt 0 ]; then
              SCORE=$(python3 -c "print(f'{100*int(\"$KILLED\")/int(\"$TOTAL\"):.1f}')")
            fi
          fi
          if [ -z "$SCORE" ]; then
            SCORE=$(grep -oP '\b\d+\.?\d*(?=%)' "$LOG" 2>/dev/null | tail -1)
          fi

          echo "Parsed checkpoint score: '${SCORE:-NOT_FOUND}'"
          echo "score=${SCORE:-N/A}" >> $GITHUB_OUTPUT
          echo "--- Last 30 lines ---"
          tail -30 "$LOG"

      - name: Mutation Score Summary
        if: always()
        run: |
          MATH_SCORE="${{ steps.mull_math.outputs.score }}"
          CKPT_SCORE="${{ steps.mull_ckpt.outputs.score }}"
          MATH_SCORE="${MATH_SCORE:-N/A}"
          CKPT_SCORE="${CKPT_SCORE:-N/A}"
          echo "════════════════════════════════════════════════════"
          echo "  LOGOS MULL Mutation Testing Results"
          echo "════════════════════════════════════════════════════"
          echo "  test_math_unit   (M1-M16) : ${MATH_SCORE}%"
          echo "  test_checkpoint  (T2b)    : ${CKPT_SCORE}%"
          echo "════════════════════════════════════════════════════"
          python3 - "$MATH_SCORE" "$CKPT_SCORE" <<'PYEOF'
          import sys, os
          math_s = sys.argv[1] if len(sys.argv) > 1 else "N/A"
          ckpt_s = sys.argv[2] if len(sys.argv) > 2 else "N/A"
          scores = []
          for s in [math_s, ckpt_s]:
              try: scores.append(float(s))
              except: pass
          avg = sum(scores)/len(scores) if scores else None

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stderr")
          with open(summary_path, "a") as f:
              f.write("## 🧬 MULL Mutation Testing — T6\n\n")
              f.write("| Target | Score |\n|--------|-------|\n")
              def grade(v):
                  if v is None: return "N/A", "⚠️"
                  if v >= 90:   return f"{v:.1f}%", "🏆"
                  if v >= 80:   return f"{v:.1f}%", "✅"
                  if v >= 60:   return f"{v:.1f}%", "⚠️"
                  return f"{v:.1f}%", "❌"
              try: ms = float(math_s)
              except: ms = None
              try: cs = float(ckpt_s)
              except: cs = None
              mv, mg = grade(ms); cv, cg = grade(cs)
              f.write(f"| `mull_math_unit`   | {mg} {mv} |\n")
              f.write(f"| `mull_checkpoint`  | {cg} {cv} |\n")
              if avg is not None:
                  av, ag = grade(avg)
                  f.write(f"| **Average** | **{ag} {av}** |\n")
              f.write("\n> See `mull-reports` artifact for HTML report\n")

          if avg is None:
              print("⚠️  Score N/A — mull runner full output upar dekho (FULL MULL OUTPUT section)")
              print("   Next CI run mein format clear ho jaayega")
              sys.exit(0)  # non-blocking jab tak format confirm na ho
          elif avg < 60:
              print(f"❌ Poor: {avg:.1f}%")
          elif avg < 80:
              print(f"⚠️  OK: {avg:.1f}%")
          else:
              print(f"✅ Good: {avg:.1f}%")
          PYEOF

      - name: Upload MULL reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mull-reports
          path: build/mull-report/
          if-no-files-found: warn
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════
  #  KAGGLE GPU TRIGGER
  #  Async: Kaggle notebook push (GPU training) — non-blocking
  #  Requires secrets:
  #    KAGGLE_USERNAME  — Kaggle account username
  #    KAGGLE_KEY       — Kaggle API key (Settings → API → Create New Token)
  #  kernel-metadata.json must exist at repo root with kernel slug.
  #
  #  Kya karta hai:
  #    1. kaggle CLI install karo
  #    2. API credentials configure karo (~/.kaggle/kaggle.json)
  #    3. kaggle_gpu_train.ipynb ko Kaggle pe push karo
  #       (kaggle kernels push — kernel-metadata.json se slug leta hai)
  #    4. Push hone ke baad status check karta hai (async)
  #
  #  main branch push par hi chalega (dev pe nahi) — GPU waste bachao.
  #  Non-blocking: continue-on-error: true
  # ═══════════════════════════════════════════════════════════════
  kaggle-gpu-trigger:
    name: "Kaggle GPU Notebook Push (async)"
    runs-on: ubuntu-22.04
    needs: [cpu-tests-linux]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    continue-on-error: true
    concurrency:
      group: kaggle-${{ github.repository }}-logos-gpu-training-v3
      cancel-in-progress: false
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install kaggle CLI
        run: pip install --quiet kaggle

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # Secrets check
          if [ -z "$KAGGLE_USERNAME" ] || [ -z "$KAGGLE_KEY" ]; then
            echo "❌ KAGGLE_USERNAME ya KAGGLE_KEY secret missing hai"
            echo "   GitHub → Settings → Secrets and variables → Actions mein add karo:"
            echo "   - KAGGLE_USERNAME : tumhara Kaggle username"
            echo "   - KAGGLE_KEY      : Kaggle API key (kaggle.com/settings → API)"
            exit 1
          fi

          mkdir -p ~/.kaggle
          cat > ~/.kaggle/kaggle.json << EOF
          {
            "username": "${KAGGLE_USERNAME}",
            "key": "${KAGGLE_KEY}"
          }
          EOF
          chmod 600 ~/.kaggle/kaggle.json
          echo "✅ Kaggle credentials configured"

      - name: Verify kernel-metadata.json
        run: |
          if [ ! -f kernel-metadata.json ]; then
            echo "❌ kernel-metadata.json root mein nahi mila"
            echo "   Example content:"
            cat << 'EOF'
          {
            "id": "YOUR_USERNAME/logos-gpu-training",
            "title": "LOGOS GPU Training",
            "code_file": "kaggle_gpu_train.ipynb",
            "language": "python",
            "kernel_type": "notebook",
            "is_private": true,
            "enable_gpu": true,
            "enable_internet": true
          }
          EOF
            exit 1
          fi

          echo "✅ kernel-metadata.json found:"
          cat kernel-metadata.json

          # Notebook exist check
          NOTEBOOK=$(python3 -c "import json; d=json.load(open('kernel-metadata.json')); print(d.get('code_file','kaggle_gpu_train.ipynb'))")
          if [ ! -f "$NOTEBOOK" ]; then
            echo "❌ Notebook nahi mila: $NOTEBOOK"
            exit 1
          fi
          echo "✅ Notebook found: $NOTEBOOK"

      - name: Push notebook to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          KERNEL_SLUG=$(python3 -c "import json; print(json.load(open('kernel-metadata.json'))['id'])")
          : > push_output.txt

          wait_for_kernel_idle() {
            local elapsed=0
            local max_wait=1800
            local status_output
            local status_exit

            while [ "$elapsed" -lt "$max_wait" ]; do
              if status_output=$(kaggle kernels status "$KERNEL_SLUG" 2>&1); then
                echo "Kaggle kernel status: $status_output" | tee -a push_output.txt
                if ! printf '%s' "$status_output" | grep -Eiq 'RUNNING|QUEUED|PENDING'; then
                  return 0
                fi
              else
                status_exit=$?
                echo "Kaggle status check failed ($status_exit): $status_output" | tee -a push_output.txt
                if printf '%s' "$status_output" | grep -Eiq '404|not found|does not exist'; then
                  return 0
                fi
                return "$status_exit"
              fi

              echo "Kernel abhi active/queued hai; 30 seconds baad status check hoga." | tee -a push_output.txt
              sleep 30
              elapsed=$((elapsed + 30))
            done

            echo "Timed out: Kaggle kernel 30 minutes mein idle nahi hua." | tee -a push_output.txt
            return 1
          }

          echo "📤 Kaggle pe notebook push ho rahi hai..."
          if ! wait_for_kernel_idle; then
            echo "❌ Push se pehle kernel status verify/idle nahi ho saka." | tee -a push_output.txt
            exit 1
          fi

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3..." | tee -a push_output.txt
            set +e
            kaggle kernels push -p . 2>&1 | tee push_attempt.txt
            PUSH_EXIT=${PIPESTATUS[0]}
            set -e
            cat push_attempt.txt >> push_output.txt

            if [ "$PUSH_EXIT" -eq 0 ]; then
              echo "✅ Notebook successfully pushed to Kaggle" | tee -a push_output.txt
              exit 0
            fi

            if ! grep -Eqi '409|conflict' push_attempt.txt; then
              if grep -q "404" push_attempt.txt; then
                echo "⚠️  Kernel not found or slug mismatch; verify kernel-metadata.json id." | tee -a push_output.txt
              elif grep -q "403" push_attempt.txt; then
                echo "❌ Auth error — KAGGLE_KEY invalid hai ya expire ho gayi." | tee -a push_output.txt
              elif grep -q "401" push_attempt.txt; then
                echo "❌ Unauthorized — KAGGLE_USERNAME ya KAGGLE_KEY galat hai." | tee -a push_output.txt
              fi
              exit "$PUSH_EXIT"
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "❌ Kaggle push 3 attempts ke baad bhi 409 Conflict de raha hai." | tee -a push_output.txt
              exit "$PUSH_EXIT"
            fi

            echo "⚠️  Kaggle returned 409 Conflict; waiting for the kernel to become idle before retry." | tee -a push_output.txt
            if ! wait_for_kernel_idle; then
              echo "❌ Conflict ke baad kernel idle/status verify nahi ho saka." | tee -a push_output.txt
              exit 1
            fi
            sleep 30
          done

      - name: Check push status (async poll)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          # kernel slug extract karo
          KERNEL_SLUG=$(python3 -c "
          import json
          d = json.load(open('kernel-metadata.json'))
          kernel_id = d.get('id', '')
          # Format: 'username/slug' — full slug as-is
          print(kernel_id)
          ")

          if [ -z "$KERNEL_SLUG" ]; then
            echo "⚠️  kernel slug nahi mila kernel-metadata.json se"
            exit 0
          fi

          echo "Kernel slug: $KERNEL_SLUG"
          echo "30 second wait — Kaggle queue mein aane do..."
          sleep 30

          # Status check (non-blocking — just info)
          echo "=== Kernel Status ==="
          kaggle kernels status "$KERNEL_SLUG" 2>&1 || \
            echo "⚠️  Status check failed — kernel shayad queue mein hai"

          echo ""
          echo "📊 Training status Kaggle pe dekho:"
          echo "   https://www.kaggle.com/code/${KERNEL_SLUG}"

      - name: Upload push log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-push-log
          path: push_output.txt
          if-no-files-found: ignore
          retention-days: 3

  # ═══════════════════════════════════════════════════════════════
  #  SUMMARY GATE
  # ═══════════════════════════════════════════════════════════════
